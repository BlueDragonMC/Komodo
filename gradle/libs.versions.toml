[versions]
# @keep Used by the build script for the Java toolchain
jvm = "25"
kotlin = "2.4.21"
shadow = "9.6.1"
velocity = "4.2.1-SNAPSHOT"
caffeine = "3.3.1"
minimessage = "5.2.0"
coroutines = "1.11.0"
grpc = "1.85.1"
grpc-kotlin-stub = "1.5.0"
protobuf = "4.36.2"
rpc = "2026-10-31-015108b"

[libraries]
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
velocity-api = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }
caffeine = { group = "com.github.ben-manes.caffeine", name = "caffeine", version.ref = "caffeine" }
minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "minimessage" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
grpc-netty = { group = "io.grpc", name = "grpc-netty", version.ref = "grpc" }
grpc-protobuf = { group = "io.grpc", name = "grpc-protobuf", version.ref = "grpc" }
grpc-kotlin-stub = { group = "io.grpc", name = "grpc-kotlin-stub", version.ref = "grpc-kotlin-stub" }
protobuf-kotlin = { group = "com.google.protobuf", name = "protobuf-kotlin", version.ref = "protobuf" }
rpc = { group = "com.bluedragonmc", name = "rpc", version.ref = "rpc" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
